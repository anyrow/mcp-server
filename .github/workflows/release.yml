# Generated by honey-clients release sync from release.config.ts; the next sync overwrites any edit.
# Publishes the tag sync pushes (or the one given to a manual run) to: npm.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, as vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is the version the package publishes
        run: |
          VERSION="${TAG#v}"
          FOUND="$(jq -er '.packages[] | select(.registry == "npm") | .version' .honey-generated.json)"
          [ "$FOUND" = "$VERSION" ] || { echo "::error::tag $TAG, but .honey-generated.json holds version $FOUND"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: npm publish
        run: |
          npm install --global npm@12.2.1
          npm publish --provenance --access public
      - name: npm serves the version
        run: |
          NAME="$(jq -er '.packages[] | select(.registry == "npm") | .name' .honey-generated.json)"
          for _ in $(seq "${LIVE_CHECK_TRIES:-60}"); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then echo "npm serves $NAME $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::npm does not serve $NAME $VERSION; the publish above did not land"
          exit 1
